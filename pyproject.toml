[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-unifi-mcp"
version = "2.5.0"
description = "A read-only MCP server for UniFi Network"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "unifi", "ubiquiti", "network", "wifi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=2.14.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Repository = "https://github.com/clearminds/clr-unifi-mcp"

[project.scripts]
clr-unifi-mcp = "clr_unifi_mcp.server:main"
